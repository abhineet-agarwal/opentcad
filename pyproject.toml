[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "opentcad"
version = "0.1.0.dev0"
description = "Open-source TCAD framework for semiconductor process and device simulation"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Abhineet Agarwal", email = "iamabhineetagarwal@gmail.com" },
]
keywords = ["tcad", "semiconductor", "device-simulation", "process-simulation", "devsim", "gmsh"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.11",
    "pyvista>=0.43",
    "pydantic>=2.0",
    "gmsh>=4.11",
    "devsim>=2.6",
    "matplotlib>=3.7",
    "pyyaml>=6.0",
]

[project.scripts]
opentcad = "opentcad.cli:main"

[project.urls]
Homepage   = "https://github.com/abhineet-agarwal/opentcad"
Repository = "https://github.com/abhineet-agarwal/opentcad"
Issues     = "https://github.com/abhineet-agarwal/opentcad/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.1",
    "mypy>=1.5",
]
gui = [
    "streamlit>=1.30",
    "plotly>=5.20",
]
# Level-set topography (deposit / etch / oxidize). Kept optional: the
# current ViennaLS wheels ship a GPL v3 license; doping and device
# simulation do not need it.
topography = [
    "ViennaLS>=5.8",
]

[tool.hatch.build.targets.wheel]
packages = ["opentcad"]

# The example simulation files double as the assistant's templates, so the
# wheel carries them inside the package (opentcad.io.deck.example_decks_dir).
[tool.hatch.build.targets.wheel.force-include]
"examples/decks/pn_diode.yaml" = "opentcad/_examples/decks/pn_diode.yaml"
"examples/decks/nmos_implanted.yaml" = "opentcad/_examples/decks/nmos_implanted.yaml"
"examples/decks/nmos_tox_sweep.yaml" = "opentcad/_examples/decks/nmos_tox_sweep.yaml"

[tool.hatch.build.targets.sdist]
include = [
    "/opentcad/",
    "/tests/",
    "/examples/decks/*.yaml",
    "/docs/",
    "/validation/",
    "/README.md",
    "/PHASES.md",
    "/LICENSE",
    "/pyproject.toml",
]
# tests/integration exercises the microrobot application in examples/,
# which is not part of the library package.
exclude = ["**/__pycache__", "/tests/integration/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow",
    "requires_devsim: requires devsim installation",
    "requires_viennaps: requires ViennaPS installation",
    "integration: full pipeline integration tests",
]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py310"
