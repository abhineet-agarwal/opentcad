# Intrinsic diffusivity of boron in silicon.
#
# Source: Fair, "Concentration-Dependent Diffusion of Dopants in Silicon"
#         (in R.B. Fair, ed., Impurity Doping Processes in Silicon, 1981);
#         values also compiled in Plummer, Silicon VLSI Technology, Table 7.2.
#
# Form: D(T) = D0_cm2s * exp(-Ea_eV / (k_B · T))
#
# Fair's model for the full concentration-dependent diffusivity is
#     D(n, p) = D_i + D_plus * (p / n_i)
# — boron is an acceptor so hole-mediated diffusion dominates. D_i is
# used by apply_anneal (intrinsic); apply_anneal_fair adds D_plus.

species: boron
symbol: B
target: Si
dopant_kind: acceptor

intrinsic:
  D0_cm2s: 0.76        # pre-exponential  [cm² / s]
  Ea_eV:   3.46        # activation energy [eV]

# Fair concentration-dependent coefficients (used by apply_anneal_fair).
# Boron: D = D_i + D_plus * (p / n_i)
fair:
  D_plus:              # hole-mediated component
    D0_cm2s: 0.95
    Ea_eV:   3.46
